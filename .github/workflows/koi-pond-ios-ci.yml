name: Koi Pond iOS CI

on:
  push:
    branches:
      - 'ci/koi-pond-ios'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - name: Reconstruct KoiPond source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          payload = ''
          out = pathlib.Path('/tmp/KoiPond-ci-min.zip')
          out.write_bytes(base64.b64decode(payload))
          print(f'restored {out.stat().st_size} bytes')
          PY
          mkdir -p "$GITHUB_WORKSPACE/generated"
          ditto -x -k /tmp/KoiPond-ci-min.zip "$GITHUB_WORKSPACE/generated"

      - name: Patch verified compiler fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("generated/KoiPond-ci-min/KoiPond")

          math = root / "Math.swift"
          s = math.read_text()
          if "import SpriteKit" not in s:
              s = s.replace("import CoreGraphics\n", "import CoreGraphics\nimport SpriteKit\n", 1)
          if "func makeEllipsePhysicsBody" not in s:
              s += """
          
          func makeEllipsePhysicsBody(size: CGSize, segments: Int = 16) -> SKPhysicsBody {
              let count = max(8, segments)
              let rx = size.width * 0.5
              let ry = size.height * 0.5
              let path = CGMutablePath()
              for index in 0..<count {
                  let angle = CGFloat(index) / CGFloat(count) * (.pi * 2)
                  let point = CGPoint(x: cos(angle) * rx, y: sin(angle) * ry)
                  if index == 0 { path.move(to: point) } else { path.addLine(to: point) }
              }
              path.closeSubpath()
              return SKPhysicsBody(polygonFrom: path)
          }
          """
          math.write_text(s)

          fish = root / "FishNode.swift"
          s = fish.read_text().replace(
              "SKPhysicsBody(ellipseOf: CGSize(width: length * 0.84, height: height * 0.84))",
              "makeEllipsePhysicsBody(size: CGSize(width: length * 0.84, height: height * 0.84))"
          )
          fish.write_text(s)

          scene = root / "PondScene.swift"
          s = scene.read_text()
          s = s.replace(
              "UIImpactFeedbackGenerator(style: strong ? .light : .soft).impactOccurred(intensity: strength)",
              "UIImpactFeedbackGenerator(style: strength > 0.8 ? .light : .soft).impactOccurred(intensity: strength)"
          )
          s = s.replace(
              "SKPhysicsBody(ellipseOf: CGSize(width: radius * 2.0, height: radius * 1.45))",
              "makeEllipsePhysicsBody(size: CGSize(width: radius * 2.0, height: radius * 1.45), segments: 20)"
          )
          scene.write_text(s)

          combined = "\n".join(p.read_text() for p in root.glob("*.swift"))
          assert "SKPhysicsBody(ellipseOf:" not in combined
          assert "UIImpactFeedbackGenerator(style: strong ?" not in combined
          assert "func makeEllipsePhysicsBody" in combined
          print("compiler-fix assertions: PASS")
          PY

      - name: Generate polished AppIcon and metadata
        shell: bash
        run: |
          set -euo pipefail
          ROOT="generated/KoiPond-ci-min"
          ASSETS="$ROOT/KoiPond/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ASSETS"
          printf '{"info":{"author":"xcode","version":1}}\n' > "$ROOT/KoiPond/Assets.xcassets/Contents.json"

          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          root = Path("generated/KoiPond-ci-min")
          project = root / "project.yml"
          raw_project = project.read_text().replace("    info:\\n      path: KoiPond/Info.plist\\n", "")
          lines = raw_project.splitlines()
          out = []
          inserted = False
          for line in lines:
              if line.strip() == "INFOPLIST_FILE: KoiPond/Info.plist":
                  line = "        INFOPLIST_FILE: KoiPond/Info.plist"
              out.append(line)
              if line.strip() == "PRODUCT_BUNDLE_IDENTIFIER: dev.omerfaruknehir.KoiPond" and not inserted:
                  out.append("        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon")
                  inserted = True
          project.write_text("\n".join(out) + "\n")

          plist_path = root / "KoiPond" / "Info.plist"
          with plist_path.open("rb") as f:
              info = plistlib.load(f)
          info["CFBundleDisplayName"] = "Koi Pond"
          info["CFBundleName"] = "KoiPond"
          with plist_path.open("wb") as f:
              plistlib.dump(info, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

          cat > /tmp/koi_icon.swift <<'SWIFT'
          import AppKit

          let side: CGFloat = 1024
          let image = NSImage(size: NSSize(width: side, height: side))
          image.lockFocus()

          NSColor(calibratedRed: 0.035, green: 0.36, blue: 0.42, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(x: 0, y: 0, width: side, height: side)).fill()

          let ripple = NSColor(calibratedRed: 0.46, green: 0.82, blue: 0.88, alpha: 1)
          for r in [210.0, 310.0, 410.0] {
              ripple.setStroke()
              let p = NSBezierPath(ovalIn: NSRect(x: 512-r, y: 512-r, width: r*2, height: r*2))
              p.lineWidth = 18
              p.stroke()
          }

          NSColor(calibratedRed: 0.13, green: 0.45, blue: 0.23, alpha: 1).setFill()
          NSBezierPath(ovalIn: NSRect(x: 80, y: 664, width: 280, height: 280)).fill()
          NSColor(calibratedRed: 0.035, green: 0.36, blue: 0.42, alpha: 1).setFill()
          let notch = NSBezierPath()
          notch.move(to: NSPoint(x: 220, y: 804))
          notch.line(to: NSPoint(x: 372, y: 856))
          notch.line(to: NSPoint(x: 372, y: 752))
          notch.close()
          notch.fill()

          let cream = NSColor(calibratedRed: 0.97, green: 0.94, blue: 0.82, alpha: 1)
          let orange = NSColor(calibratedRed: 0.98, green: 0.36, blue: 0.08, alpha: 1)

          cream.setFill()
          let tail = NSBezierPath()
          tail.move(to: NSPoint(x: 252, y: 512))
          tail.line(to: NSPoint(x: 92, y: 642))
          tail.line(to: NSPoint(x: 92, y: 382))
          tail.close()
          tail.fill()

          cream.setFill()
          NSBezierPath(ovalIn: NSRect(x: 225, y: 372, width: 610, height: 280)).fill()
          orange.setFill()
          NSBezierPath(ovalIn: NSRect(x: 248, y: 390, width: 565, height: 244)).fill()

          cream.setFill()
          let finTop = NSBezierPath()
          finTop.move(to: NSPoint(x: 520, y: 608))
          finTop.line(to: NSPoint(x: 575, y: 760))
          finTop.line(to: NSPoint(x: 625, y: 590))
          finTop.close()
          finTop.fill()
          let finBottom = NSBezierPath()
          finBottom.move(to: NSPoint(x: 505, y: 414))
          finBottom.line(to: NSPoint(x: 560, y: 272))
          finBottom.line(to: NSPoint(x: 610, y: 430))
          finBottom.close()
          finBottom.fill()

          cream.setFill()
          NSBezierPath(ovalIn: NSRect(x: 420, y: 455, width: 190, height: 150)).fill()
          NSColor(calibratedRed: 1.0, green: 0.64, blue: 0.30, alpha: 1).setFill()
          NSBezierPath(ovalIn: NSRect(x: 345, y: 535, width: 125, height: 55)).fill()

          NSColor.black.setFill()
          NSBezierPath(ovalIn: NSRect(x: 730, y: 525, width: 34, height: 34)).fill()

          image.unlockFocus()
          guard let tiff = image.tiffRepresentation,
                let bitmap = NSBitmapImageRep(data: tiff),
                let jpg = bitmap.representation(using: .jpeg, properties: [.compressionFactor: 1.0]) else {
              fatalError("icon render failed")
          }
          try jpg.write(to: URL(fileURLWithPath: "/tmp/KoiPond-icon-master.jpg"))
          SWIFT
          swift /tmp/koi_icon.swift

          sips -s format png /tmp/KoiPond-icon-master.jpg --out "$ASSETS/Icon-1024.png" >/dev/null
          sips -z 40 40 "$ASSETS/Icon-1024.png" --out "$ASSETS/Icon-20@2x.png" >/dev/null
          sips -z 60 60 "$ASSETS/Icon-1024.png" --out "$ASSETS/Icon-20@3x.png" >/dev/null
          sips -z 58 58 "$ASSETS/Icon-1024.png" --out "$ASSETS/Icon-29@2x.png" >/dev/null
          sips -z 87 87 "$ASSETS/Icon-1024.png" --out "$ASSETS/Icon-29@3x.png" >/dev/null
          sips -z 80 80 "$ASSETS/Icon-1024.png" --out "$ASSETS/Icon-40@2x.png" >/dev/null
          sips -z 120 120 "$ASSETS/Icon-1024.png" --out "$ASSETS/Icon-40@3x.png" >/dev/null
          sips -z 120 120 "$ASSETS/Icon-1024.png" --out "$ASSETS/Icon-60@2x.png" >/dev/null
          sips -z 180 180 "$ASSETS/Icon-1024.png" --out "$ASSETS/Icon-60@3x.png" >/dev/null

          cat > "$ASSETS/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "Icon-20@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "20x20" },
              { "filename" : "Icon-20@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "20x20" },
              { "filename" : "Icon-29@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "29x29" },
              { "filename" : "Icon-29@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "29x29" },
              { "filename" : "Icon-40@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "40x40" },
              { "filename" : "Icon-40@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "40x40" },
              { "filename" : "Icon-60@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60" },
              { "filename" : "Icon-60@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60" },
              { "filename" : "Icon-1024.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

          test -s "$ASSETS/Icon-1024.png"
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' "$ROOT/project.yml"
          /usr/bin/plutil -extract CFBundleDisplayName raw "$ROOT/KoiPond/Info.plist" | grep -qx 'Koi Pond'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        working-directory: generated/KoiPond-ci-min
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: generated/KoiPond-ci-min
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project KoiPond.xcodeproj \
            -scheme KoiPond \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package unsigned IPA
        working-directory: generated/KoiPond-ci-min
        shell: bash
        run: |
          set -euxo pipefail
          APP='build/device/Build/Products/Release-iphoneos/KoiPond.app'
          test -d "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/KoiPond-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KoiPond-iPhone
          if-no-files-found: error
          retention-days: 30
          path: KoiPond-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KoiPond-build-log
          if-no-files-found: warn
          retention-days: 30
          path: xcodebuild.log
